# PiePad — Docker Compose
#
# Profiles:
#   (default) — production stack: caddy + web + ws + cleanup
#   runtime   — optional self-hosted Piston (skip if PISTON_URL points at
#               the public API, e.g. https://emkc.org/api/v2/piston)
#   tools     — one-shot Flyway migrate/info/validate
#
# Run from repo root via package.json scripts (pnpm db:migrate, pnpm piston:up).
# Scripts pass --env-file .env so ${...} interpolation below resolves from the
# project-root .env, not docker/.env (compose default).

services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp" # HTTP/3
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    environment:
      PUBLIC_HOST: "${PUBLIC_HOST}"
    # Wait for web AND ws to actually be healthy (not just started) so the
    # first request after a deploy doesn't 502 mid-Oracle-pool-init.
    depends_on:
      web:
        condition: service_healthy
      ws:
        condition: service_healthy
    mem_limit: 128m

  web:
    # Image is built and pushed by CI (.github/workflows/deploy.yml) — the
    # small prod box no longer compiles Next.js (that broke the deploy SSH
    # pipe). NEXT_PUBLIC_* are baked into this image at CI build time via a
    # build-arg, so they are NOT set here. IMAGE_TAG is the commit SHA in
    # prod (written into .env by CI); falls back to `latest`.
    image: ghcr.io/galaxytemple/piepad-web:${IMAGE_TAG:-latest}
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      # Container-internal addressing overrides whatever's in .env (which is
      # tuned for host dev). Wallet is mounted in-place so resolveWalletDir
      # picks /wallet directly.
      ORACLE_WALLET_DIR: /wallet
      WS_INTERNAL_URL: http://ws:1234
      # Default to in-compose Piston; override in .env to use the public API.
      PISTON_URL: "${PISTON_URL:-http://piston:2000/api/v2}"
    volumes:
      - ../wallet:/wallet:ro
    depends_on:
      ws:
        condition: service_healthy
    # TCP-port liveness check. Hitting "/" goes through Auth.js + the proxy
    # 302 to /login, and on a cold container that chain occasionally exceeds
    # the 5s timeout — caddy then refuses to start because depends_on is
    # service_healthy. "Process is listening on 3000" is the actual
    # condition caddy needs to reverse-proxy.
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('net').connect({host:'127.0.0.1',port:3000}).on('connect',function(){this.end();process.exit(0)}).on('error',function(){process.exit(1)})\""]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s
    # 1GB ARM box; Next.js standalone runtime sits comfortably under 384MB
    # even at peak. mem_limit makes OOM-killer behaviour deterministic
    # instead of letting it pick at random across containers.
    mem_limit: 384m

  ws:
    image: ghcr.io/galaxytemple/piepad-ws:${IMAGE_TAG:-latest}
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      ORACLE_WALLET_DIR: /wallet
      LEVELDB_PATH: /data/yjs
    volumes:
      - ../wallet:/wallet:ro
      - ws_data:/data/yjs
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://127.0.0.1:1234/health',function(r){process.exit(r.statusCode===200?0:1)}).on('error',function(){process.exit(1)}).setTimeout(3000,function(){this.destroy();process.exit(1)})\""]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    mem_limit: 256m

  cleanup:
    image: ghcr.io/galaxytemple/piepad-cleanup:${IMAGE_TAG:-latest}
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      ORACLE_WALLET_DIR: /wallet
      WS_INTERNAL_URL: http://ws:1234
    volumes:
      - ../wallet:/wallet:ro
    depends_on:
      ws:
        condition: service_healthy
    # Just a node-cron worker; no HTTP endpoint to probe. Process-liveness
    # check via a tiny no-op exec.
    healthcheck:
      test: ["CMD-SHELL", "node -e 'process.exit(0)'"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 10s
    mem_limit: 128m

  flyway:
    image: flyway/flyway:10-alpine
    profiles: ["tools"]
    environment:
      FLYWAY_URL: "jdbc:oracle:thin:@${ORACLE_TNS_NAME}?TNS_ADMIN=${ORACLE_WALLET_DIR}"
      FLYWAY_USER: "${ORACLE_USER}"
      FLYWAY_PASSWORD: "${ORACLE_PASSWORD}"
    volumes:
      - ../db/migrations:/flyway/sql:ro
      - ../db/flyway.conf:/flyway/conf/flyway.conf:ro
      - ../wallet:/wallet:ro
    command: ["-configFiles=/flyway/conf/flyway.conf", "info"]

  piston:
    image: ghcr.io/engineer-man/piston:latest
    profiles: ["runtime"]
    container_name: piepad-piston
    restart: unless-stopped
    privileged: true # nsjail isolation primitives require root capabilities
    # Docker Desktop's user-namespace remapping breaks nsjail's
    # CLONE_NEWUSER call ('clone failed: Invalid argument'). Sharing the
    # host's user namespace works around it.
    userns_mode: host
    security_opt:
      - seccomp=unconfined
      - apparmor=unconfined
    # No ports published: web reaches piston via the Docker-internal network as
    # http://piston:2000. Publishing 2000 to the host would let any client on
    # the internet POST /api/v2/execute and bypass /api/run rate limiting.
    # Local dev that needs to hit piston directly can `docker compose port
    # piston 2000` or override this file with a docker-compose.override.yml.
    expose:
      - "2000"
    environment:
      PISTON_LOG_LEVEL: INFO
      PISTON_BIND_ADDRESS: 0.0.0.0:2000
      PISTON_DISABLE_NETWORKING: "true" # executed code cannot make outbound calls
      # Per-job ceilings the API enforces. Must be >= the values our /api/run
      # passes (RUN_TIMEOUT_MS / COMPILE_TIMEOUT_MS) or Piston returns 400.
      PISTON_RUN_TIMEOUT: "30000"
      PISTON_COMPILE_TIMEOUT: "30000"
    volumes:
      - piston_packages:/piston/packages
    # nsjail bind-mounts /piston/jobs and needs an `exec`-capable filesystem
    # whose mount flags it can clone. A regular Docker volume causes
    # 'clone failed: Invalid argument'; tmpfs with these flags is the
    # configuration the upstream piston compose ships with.
    tmpfs:
      - /piston/jobs:exec,uid=1000,gid=1000,mode=711
    mem_limit: 384m

volumes:
  caddy_data:
  caddy_config:
  ws_data:
  piston_packages:
