# PiePad — Docker Compose
#
# Phases:
#   - tools profile: one-shot Flyway migrate/info/validate
#   - default profile (TODO): caddy / web / ws / piston / cleanup
#
# Run from repo root via package.json scripts (pnpm db:migrate etc).
# Scripts pass --env-file .env so ${...} interpolation below resolves
# from the project-root .env, not docker/.env (compose default).

services:
  flyway:
    image: flyway/flyway:10-alpine
    profiles: ["tools"]
    environment:
      FLYWAY_URL: "jdbc:oracle:thin:@${ORACLE_TNS_NAME}?TNS_ADMIN=${ORACLE_WALLET_DIR}"
      FLYWAY_USER: "${ORACLE_USER}"
      FLYWAY_PASSWORD: "${ORACLE_PASSWORD}"
    volumes:
      - ../db/migrations:/flyway/sql:ro
      - ../db/flyway.conf:/flyway/conf/flyway.conf:ro
      - ../wallet:/wallet:ro
    command: ["-configFiles=/flyway/conf/flyway.conf", "info"]
