# PiePad — Piston runtime, standalone (runs on the A1 instance only)
#
# The web app calls this over the PRIVATE VCN at http://<A1_PRIVATE_IP>:2000.
# It must never be reachable from the public internet: publishing 2000 openly
# would let anyone POST /api/v2/execute and bypass /api/run's auth + rate limit.
#
# Two independent layers keep it private (set both up — see
# script/a1-piston-bootstrap.sh and the OCI security list):
#   1. This compose binds the published port to the private NIC only
#      (PISTON_BIND_IP), not 0.0.0.0.
#   2. Host iptables + the OCI security list allow TCP 2000 ONLY from the web
#      instance's private IP.
#
# Usage on A1 (from /opt/piepad-piston, with a .env containing PISTON_BIND_IP):
#   docker compose --env-file .env -f docker/piston-compose.yml up -d
#   bash scripts/install-piston-langs.sh "http://${PISTON_BIND_IP}:2000"

services:
  piston:
    image: ghcr.io/engineer-man/piston:latest
    container_name: piepad-piston
    restart: unless-stopped
    privileged: true # nsjail isolation primitives require root capabilities
    userns_mode: host
    security_opt:
      - seccomp=unconfined
      - apparmor=unconfined
    # Bind to the private NIC only. PISTON_BIND_IP MUST be the A1 private IP
    # (e.g. 10.0.0.5); compose errors if unset, which is intentional — we do
    # NOT want a silent 0.0.0.0 fallback that could expose the runtime.
    ports:
      - "${PISTON_BIND_IP:?set PISTON_BIND_IP to the A1 private IP}:2000:2000"
    environment:
      PISTON_LOG_LEVEL: INFO
      PISTON_BIND_ADDRESS: 0.0.0.0:2000 # inside the container; host bind is above
      PISTON_DISABLE_NETWORKING: "true" # executed code cannot make outbound calls
      # Must be >= the web app's RUN_TIMEOUT_MS / COMPILE_TIMEOUT_MS (10000) or
      # Piston 400s the request.
      PISTON_RUN_TIMEOUT: "30000"
      PISTON_COMPILE_TIMEOUT: "30000"
    volumes:
      - piston_packages:/piston/packages
    # nsjail bind-mounts /piston/jobs and needs an exec-capable filesystem; a
    # regular Docker volume causes 'clone failed: Invalid argument'.
    tmpfs:
      - /piston/jobs:exec,uid=1000,gid=1000,mode=711
    # A1 has 24 GB; give the runtime real headroom (was 384m when co-located
    # with web on the 1 GB box).
    mem_limit: 2g

volumes:
  piston_packages:
