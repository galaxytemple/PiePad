name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: deploy-prod
  cancel-in-progress: false # never abort a half-finished deploy

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      # The runner has the source; the VM never talks to GitHub.
      - uses: actions/checkout@v4

      - name: Configure SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          set -e

          if [ -z "${DEPLOY_HOST:-}" ]; then
            echo "::error::DEPLOY_HOST secret is empty"; exit 1
          fi
          if [ -z "${DEPLOY_SSH_KEY:-}" ]; then
            echo "::error::DEPLOY_SSH_KEY secret is empty"; exit 1
          fi

          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy
          chmod 600 ~/.ssh/deploy

          # Sanity-check the private key shape without leaking the body
          if ! grep -q -- '-----BEGIN' ~/.ssh/deploy; then
            echo "::error::DEPLOY_SSH_KEY does not look like a PEM private key (missing BEGIN line)"
            exit 1
          fi
          echo "Key first line: $(head -1 ~/.ssh/deploy)"
          echo "Key last line:  $(tail -1 ~/.ssh/deploy)"
          echo "Key line count: $(wc -l < ~/.ssh/deploy)"

          # Direct TCP probe first — distinguishes network/firewall block
          # from an actual ssh-keyscan failure mode.
          echo "TCP 22 reachability:"
          if command -v nc >/dev/null 2>&1; then
            nc -vz -w 10 "$DEPLOY_HOST" 22 2>&1 | sed 's/^/  /' || true
          fi
          echo "Runner public IP: $(curl -fsS https://api.ipify.org || echo unknown)"

          # ssh-keyscan times out at 5s by default; bump it and don't let
          # `-H` errors silently mask connectivity failures.
          if ! ssh-keyscan -T 15 "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2> /tmp/keyscan.err; then
            echo "::error::ssh-keyscan failed against $DEPLOY_HOST"
            echo "stderr:"
            sed 's/^/  /' /tmp/keyscan.err
            exit 1
          fi
          if [ ! -s ~/.ssh/known_hosts ]; then
            echo "::error::ssh-keyscan produced no host keys — is port 22 open from GitHub runners?"
            cat /tmp/keyscan.err
            exit 1
          fi
          echo "known_hosts entries: $(wc -l < ~/.ssh/known_hosts)"

      # Build .env on the runner from Secrets so production credentials never
      # land in the repo and the VM doesn't need a credential file of its own.
      - name: Build .env
        run: |
          cat > .env <<EOF
          PUBLIC_IP=${{ secrets.PUBLIC_IP }}
          PUBLIC_HOST=${{ secrets.PUBLIC_HOST }}

          ORACLE_USER=${{ secrets.ORACLE_USER }}
          ORACLE_PASSWORD=${{ secrets.ORACLE_PASSWORD }}
          ORACLE_TNS_NAME=${{ secrets.ORACLE_TNS_NAME }}
          ORACLE_WALLET_DIR=/wallet
          ORACLE_WALLET_PASSWORD=${{ secrets.ORACLE_WALLET_PASSWORD }}

          AUTH_SECRET=${{ secrets.AUTH_SECRET }}
          AUTH_GOOGLE_ID=${{ secrets.AUTH_GOOGLE_ID }}
          AUTH_GOOGLE_SECRET=${{ secrets.AUTH_GOOGLE_SECRET }}
          ADMIN_EMAILS=${{ secrets.ADMIN_EMAILS }}

          NEXT_PUBLIC_WS_URL=wss://${{ secrets.PUBLIC_HOST }}/yjs
          WS_INTERNAL_URL=http://ws:1234
          PISTON_URL=${{ secrets.PISTON_URL }}

          BCRYPT_ROUNDS=12
          RUN_RATE_LIMIT_PER_MINUTE=10
          RUN_TIMEOUT_MS=10000
          COMPILE_TIMEOUT_MS=10000

          SNAPSHOT_INTERVAL_MS=30000
          ROOM_TTL_DAYS=30
          CLEANUP_CRON=0 3 * * *
          CLEANUP_RUN_ON_START=true
          EOF

      # Push the source + .env to the VM. --delete keeps it in sync with main,
      # --exclude protects state that lives only on the VM (wallet, runtime
      # data, build caches).
      - name: Sync to VM
        env:
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          rsync -az --delete \
            --exclude='.git/' \
            --exclude='node_modules/' \
            --exclude='**/node_modules/' \
            --exclude='.next/' \
            --exclude='**/.next/' \
            --exclude='wallet/' \
            --exclude='data/' \
            --exclude='**/data/' \
            -e "ssh -i ~/.ssh/deploy" \
            ./ "$DEPLOY_USER@$DEPLOY_HOST:/opt/piepad/"

          ssh -i ~/.ssh/deploy "$DEPLOY_USER@$DEPLOY_HOST" \
            "chmod 600 /opt/piepad/.env && chmod +x /opt/piepad/scripts/dc /opt/piepad/scripts/install-piston-langs.sh"

      - name: Migrate, build, restart
        env:
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          ssh -i ~/.ssh/deploy "$DEPLOY_USER@$DEPLOY_HOST" "set -euo pipefail
            cd /opt/piepad

            ./scripts/dc --profile tools run --rm flyway migrate

            ./scripts/dc up -d --build --remove-orphans

            docker image prune -f
          "

      - name: Health check
        env:
          PUBLIC_HOST: ${{ secrets.PUBLIC_HOST }}
        run: |
          for i in 1 2 3 4 5; do
            if curl -fsS --max-time 10 "https://${PUBLIC_HOST}/" >/dev/null; then
              echo "✓ healthy"
              exit 0
            fi
            sleep 8
          done
          echo "::warning::homepage did not respond within 40s — check ./scripts/dc logs caddy/web"
